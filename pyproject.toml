[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "mcp-one"
version = "1.0.0rc1"
description = "Domain-independent native MCP gateway and control plane"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "MIT"
dependencies = [
  "mcp==2.2.0", "mcp-types==2.2.0", "pydantic==2.13.5",
  "httpx2==2.12.0", "uvicorn==0.52.4", "starlette==1.6.0",
  "PyYAML==6.0.3", "jsonschema==4.26.0", "referencing==0.37.0",
  "structlog==26.1.0", "prometheus-client>=0.22,<1",
  "opentelemetry-sdk==1.44.0", "opentelemetry-exporter-otlp-proto-http==1.44.0",
]

[project.scripts]
mcp-one = "mcp_one.server:main"

[dependency-groups]
dev = [
  "pytest==9.1.1", "pytest-asyncio==1.4.0", "pytest-cov==7.1.0",
  "ruff==0.16.7", "mypy==2.3.1", "types-PyYAML==6.0.12.20260906",
  "types-jsonschema==4.26.0.20260518", "httpx==0.28.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_one"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["contract: native SDK contract", "integration: real HTTP fault injection", "e2e: native client gateway downstream"]
addopts = "-ra"

[tool.coverage.run]
source = ["mcp_one"]
branch = true
patch = ["subprocess"]
sigterm = true

[tool.coverage.report]
fail_under = 80
show_missing = true
