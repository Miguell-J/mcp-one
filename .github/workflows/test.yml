name: Native MCP gateway
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.12.13
      - run: uv sync --locked
      - run: make check
      - run: make schema && git diff --exit-code -- docs/config.schema.json
      - run: uv build --no-sources
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - run: docker build --target runtime -t mcp-one:ci .
      - run: docker build --target development -t mcp-one-tests:ci .
      - run: docker run --rm --cap-drop ALL --security-opt no-new-privileges mcp-one-tests:ci
