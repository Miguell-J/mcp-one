name: mcp-one
services:
  mcp-one:
    build: {context: ., target: runtime}
    image: mcp-one:1.0.0rc1
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["./config.yaml:/app/config.yaml:ro"]
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    init: true
    stop_grace_period: 20s
